name: Update Local Stats Cards

on:
  schedule:
    - cron: "0 */5 * * *" # every 5 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and update local streak and activity SVGs
        run: node scripts/update-stats.mjs

      - name: Commit & Push if SVGs changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add streak-stats.svg activity-graph.svg
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "Auto-update streak and activity graph SVGs" && git push)

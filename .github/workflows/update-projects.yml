name: Update Public Projects

on:
  schedule:
    - cron: "8 1 * * *" # 04:08 Israel Time (01:08 UTC - 2 min interval)
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.svg"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate projects section from public repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.mjs

      - name: Commit & push if README changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update public projects SVG card and README"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep $((i * 3))
            done
          else
            echo "No changes to commit"
          fi

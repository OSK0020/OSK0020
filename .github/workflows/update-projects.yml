name: Update Public Projects

on:
  schedule:
    - cron: "0 3 * * *" # once a day
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate projects section from public repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.mjs

      - name: Commit & push if README changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects.svg README.md
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto-update public projects SVG card and README" && git push)

name: Update OSK Custom Cards

on:
  schedule:
    - cron: "0 1 * * *" # Once a day at 04:00 Israel Time (01:00 UTC)
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.svg"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-custom-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dynamic OSK custom SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-custom-cards.mjs

      - name: Commit & Push if cards changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add hero.svg about.svg stack.svg refresh-button.svg
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update OSK custom SVGs (Hero, About, Stack, Refresh Button)"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep $((i * 3))
            done
          else
            echo "No changes to commit"
          fi

name: Update OSK Custom Cards

on:
  schedule:
    - cron: "0 */5 * * *" # every 5 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-custom-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dynamic OSK custom SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-custom-cards.mjs

      - name: Commit & Push if cards changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add hero.svg about.svg stack.svg refresh-button.svg gitskins-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update OSK custom SVGs (Hero, About, Stack, Refresh Button)"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

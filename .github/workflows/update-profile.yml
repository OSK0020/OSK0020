name: 🚀 Update OSK0020 Profile (Unified)

on:
  schedule:
    # Run once a day at 04:00 Israel Time (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-all]

jobs:
  update-all:
    name: ⚡ Sync All Profile Cards, Stats & Animations
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎨 Generate Dynamic Profile Cards, Stats & Projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Generating Custom Cards (Hero, About, Stack, Refresh)"
          node scripts/update-custom-cards.mjs
          echo "::endgroup::"

          echo "::group::Generating Dynamic Stats & Streak SVGs"
          node scripts/update-stats.mjs
          echo "::endgroup::"

          echo "::group::Generating Achievements HUD Card"
          node scripts/update-achievements.mjs
          echo "::endgroup::"

          echo "::group::Generating Public Projects Card & README Sync"
          node scripts/update-projects.mjs
          echo "::endgroup::"

      - name: 🧊 Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: OSK0020

      - name: 🚀 Commit & Push Profile Updates to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add hero.svg about.svg stack.svg refresh-button.svg stats.svg streak-stats.svg achievements.svg projects.svg README.md profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update all profile cards, stats, projects & 3D graph [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in main branch assets to commit"
          fi

      - name: 🐍 Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: OSK0020
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 📤 Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

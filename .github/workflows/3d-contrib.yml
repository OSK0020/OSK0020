name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib-svg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: OSK0020
      - name: Commit & Push 3D Contrib SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "Auto-update 3D Contribution Graph" && git push)

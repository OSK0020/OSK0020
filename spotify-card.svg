<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120" fill="none">
  <defs>
    <!-- Background Gradient (Claude Warm Crimson & Cyber Dark) -->
    <linearGradient id="spotify-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0e0e" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Claude & Spotify Border -->
    <linearGradient id="spotify-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d95338" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1DB954" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Album Cover Glow -->
    <radialGradient id="album-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d95338" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Live Sound Wave Equalizer Animations */
    @keyframes bar-pulse-1 { 0%, 100% { height: 8px; y: 46px; } 50% { height: 32px; y: 22px; } }
    @keyframes bar-pulse-2 { 0%, 100% { height: 28px; y: 26px; } 50% { height: 12px; y: 42px; } }
    @keyframes bar-pulse-3 { 0%, 100% { height: 16px; y: 38px; } 50% { height: 36px; y: 18px; } }
    @keyframes bar-pulse-4 { 0%, 100% { height: 34px; y: 20px; } 50% { height: 10px; y: 44px; } }
    @keyframes bar-pulse-5 { 0%, 100% { height: 20px; y: 34px; } 50% { height: 30px; y: 24px; } }

    .eq-bar { fill: #d95338; rx: 3px; ry: 3px; }
    .eq-1 { animation: bar-pulse-1 1.2s infinite ease-in-out; }
    .eq-2 { animation: bar-pulse-2 0.9s infinite ease-in-out 0.2s; }
    .eq-3 { animation: bar-pulse-3 1.4s infinite ease-in-out 0.4s; }
    .eq-4 { animation: bar-pulse-4 1.0s infinite ease-in-out 0.1s; }
    .eq-5 { animation: bar-pulse-5 1.3s infinite ease-in-out 0.3s; }

    /* Vinyl Disk Spin Animation */
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .vinyl-spin { transform-origin: 60px 60px; animation: spin 8s linear infinite; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="116" rx="18" fill="url(#spotify-bg)" stroke="url(#spotify-border)" stroke-width="1.5"/>

  <!-- Spotify Vinyl Record / Album Art Icon -->
  <a href="https://open.spotify.com/playlist/5l9o7NHJEYaDkql1uVyvTJ" target="_blank">
    <circle cx="60" cy="60" r="42" fill="url(#album-glow)"/>
    <g class="vinyl-spin">
      <circle cx="60" cy="60" r="34" fill="#040404" stroke="#d95338" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="26" fill="none" stroke="#281414" stroke-width="1"/>
      <circle cx="60" cy="60" r="18" fill="none" stroke="#3a1c1c" stroke-width="1"/>
      <circle cx="60" cy="60" r="12" fill="#d95338"/>
      <circle cx="60" cy="60" r="4" fill="#040404"/>
    </g>

    <!-- Spotify Logo Badge Overlay -->
    <g transform="translate(74, 74)">
      <circle cx="12" cy="12" r="12" fill="#1DB954"/>
      <path d="M17.8 11.2c-2.3-1.4-6.1-1.5-8.3-.8-.4.1-.8-.1-.9-.5-.1-.4.1-.8.5-.9 2.5-.8 6.7-.6 9.3 1 .4.2.5.7.3 1.1-.2.3-.7.5-1 .1zm-.2 2.6c-.2.3-.6.4-.9.2-1.9-1.2-4.9-1.5-7.2-.8-.3.1-.7-.1-.8-.4-.1-.3.1-.7.4-.8 2.6-.8 5.9-.4 8.2 1 .3.2.4.6.3.8zm-.3 2.6c-.2.2-.5.3-.7.1-1.7-1-3.8-1.2-6.3-.7-.3.1-.5-.1-.6-.3-.1-.3.1-.5.3-.6 2.8-.6 5.2-.4 7.1.8.3.1.3.5.2.7z" fill="#040404"/>
    </g>
  </a>

  <!-- Track & Artist Info -->
  <g transform="translate(120, 36)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="180" height="20" rx="10" fill="#d95338" fill-opacity="0.18" stroke="#d95338" stroke-opacity="0.5" stroke-width="1"/>
    <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#e26d5c" letter-spacing="1">SPOTIFY // PUBLIC PLAYLIST</text>

    <!-- Playlist Title -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Claude Code Vibe</text>
    
    <!-- Playlist Description & Highlights -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#b3b3b3">by tezcan00 • Tame Impala, Daft Punk, MoBlack &amp; 90+ Coding Beats</text>
  </g>

  <!-- Live Animated Sound Wave Equalizer (Right Side) -->
  <g transform="translate(730, 35)">
    <!-- Sound Waves Container Background -->
    <rect x="-15" y="-5" width="105" height="60" rx="12" fill="#1c1212" stroke="#3a1e1e" stroke-width="1"/>
    
    <!-- 5 Animated Equalizer Bars (Claude Crimson Gradient) -->
    <rect x="0" y="30" width="6" height="20" class="eq-bar eq-1"/>
    <rect x="14" y="26" width="6" height="28" class="eq-bar eq-2"/>
    <rect x="28" y="18" width="6" height="36" class="eq-bar eq-3"/>
    <rect x="42" y="20" width="6" height="34" class="eq-bar eq-4"/>
    <rect x="56" y="24" width="6" height="30" class="eq-bar eq-5"/>
    <rect x="70" y="32" width="6" height="16" class="eq-bar eq-1"/>
  </g>
</svg>

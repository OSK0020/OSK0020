<svg xmlns="http://www.w3.org/2000/svg" width="850" height="110" viewBox="0 0 850 110" fill="none">
  <defs>
    <!-- Card Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f7ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Pill Glassmorphism Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pill Border Glow -->
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#484f58" />
    </linearGradient>

    <!-- Icon Circle Gradients -->
    <linearGradient id="github-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#181717" />
    </linearGradient>

    <linearGradient id="telegram-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" />
      <stop offset="100%" stop-color="#229ED9" />
    </linearGradient>

    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3036" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="email-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#B31412" />
    </linearGradient>
  </defs>

  <!-- Outer Main Card Container -->
  <rect x="2" y="2" width="846" height="106" rx="20" fill="#0d1117" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Inner Glass Area -->
  <rect x="14" y="14" width="822" height="82" rx="14" fill="#161b22" fill-opacity="0.6" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(24, 25)">
    <!-- 1. GitHub Pill (Width: 160px) -->
    <a href="https://github.com/OSK0020" target="_blank">
      <g transform="translate(0, 0)">
        <rect width="160" height="60" rx="16" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1"/>
        <circle cx="28" cy="30" r="16" fill="url(#github-grad)"/>
        <!-- GitHub Icon -->
        <path d="M28 19c-6.07 0-11 4.93-11 11 0 4.86 3.15 8.98 7.52 10.43.55.1.75-.24.75-.53 0-.26-.01-.95-.01-1.86-3.07.67-3.72-1.48-3.72-1.48-.5-1.27-1.22-1.61-1.22-1.61-1-.69.08-.67.08-.67 1.11.08 1.69 1.14 1.69 1.14.99 1.69 2.59 1.2 3.22.92.1-.72.39-1.2.71-1.47-2.45-.28-5.03-1.23-5.03-5.46 0-1.21.43-2.19 1.14-2.96-.11-.28-.49-1.4.11-2.92 0 0 .93-.3 3.05 1.14.88-.25 1.83-.37 2.77-.37.94 0 1.89.12 2.77.37 2.12-1.44 3.05-1.14 3.05-1.14.6 1.52.22 2.64.11 2.92.71.77 1.14 1.75 1.14 2.96 0 4.24-2.58 5.18-5.04 5.45.4.34.76 1.02.76 2.06 0 1.49-.01 2.69-.01 3.06 0 .29.2.64.76.53C35.85 39.98 39 35.86 39 30c0-6.07-4.93-11-11-11z" fill="#ffffff"/>
        <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">GitHub</text>
        <text x="54" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">@osk0020</text>
      </g>
    </a>

    <!-- 2. Telegram / Website Pill (Width: 190px) -->
    <a href="https://t.me/OSN_Reports" target="_blank">
      <g transform="translate(172, 0)">
        <rect width="190" height="60" rx="16" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1"/>
        <circle cx="28" cy="30" r="16" fill="url(#telegram-grad)"/>
        <!-- Telegram Icon -->
        <path d="M19.5 29.5l9-3.5-3.5 9-2.5-3-3-2.5z" fill="none"/>
        <path d="M34.5 20.5l-19 7.3c-1.3.5-1.3 1.3 0 1.7l4.9 1.5 11.3-7.1c.5-.3 1 .1.6.5L23.1 32.7l-.3 3.6c.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.2 1.8-.8l3.3-15.5c.3-1.2-.4-1.7-1.8-1.1z" fill="#ffffff"/>
        <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">Telegram</text>
        <text x="54" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">t.me/OSN_Reports</text>
      </g>
    </a>

    <!-- 3. X / Twitter Pill (Width: 165px) -->
    <a href="https://x.com/OSN_Reports" target="_blank">
      <g transform="translate(374, 0)">
        <rect width="165" height="60" rx="16" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1"/>
        <circle cx="28" cy="30" r="16" fill="url(#x-grad)"/>
        <!-- X Icon -->
        <path d="M32.6 20h2.9l-6.3 7.2 7.4 9.8h-5.8l-4.5-6-5.2 6h-2.9l6.7-7.7-7.1-9.3h6l4.1 5.4 4.7-5.4zm-1 15.3h1.6L23.5 21.6h-1.7l9.8 13.7z" fill="#ffffff"/>
        <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">X</text>
        <text x="54" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">@OSN_Reports</text>
      </g>
    </a>

    <!-- 4. Email Pill (EXPANDED Width: 224px - FULL EMAIL NO TRUNCATION!) -->
    <a href="mailto:oristern8@gmail.com">
      <g transform="translate(551, 0)">
        <rect width="224" height="60" rx="16" fill="url(#pill-bg)" stroke="url(#pill-border)" stroke-width="1"/>
        <circle cx="28" cy="30" r="16" fill="url(#email-grad)"/>
        <!-- Email Icon -->
        <path d="M20 23h16c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1H20c-.55 0-1-.45-1-1V24c0-.55.45-1 1-1zm0 2v.5l8 5 8-5V25H20zm16 10V28l-8 5-8-5v7h16z" fill="#ffffff"/>
        <text x="54" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">Email</text>
        <text x="54" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">oristern8@gmail.com</text>
      </g>
    </a>
  </g>
</svg>

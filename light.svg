<svg xmlns="http://www.w3.org/2000/svg" width="850" height="170" viewBox="0 0 850 170" fill="none">
  <style>
    .bg { fill: #ffffff; rx: 12px; }
    .title { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #007acc; }
    .cell { rx: 2px; ry: 2px; transition: all 0.3s; }
    .c0 { fill: #ebedf0; }
    .c1 { fill: #9be9a8; }
    .c2 { fill: #40c463; }
    .c3 { fill: #30a14e; }
    .c4 { fill: #216e39; filter: drop-shadow(0 0 4px #40c463); }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .active-pulse { animation: pulse 2s infinite ease-in-out; }
  </style>

  <rect width="850" height="170" class="bg" stroke="#e1e4e8" stroke-width="1"/>

  <text x="25" y="32" class="title">⚡ GITHUB JET HEATMAP &amp; CONTRIBUTION SIGNAL // OSK0020</text>

